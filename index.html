.field select{width:100%}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed #cddae5;border-radius:12px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.summary-box{background:#f7fafc;border:1px solid var(--line);border-radius:11px;padding:12px}.summary-box b{display:block;font-size:20px}.toast{position:fixed;right:20px;bottom:20px;background:#102b40;color:#fff;padding:13px 16px;border-radius:11px;box-shadow:var(--shadow);display:none;z-index:50}.toast.show{display:block}.bottomnav{display:none}@media(max-width:850px){.sidebar{display:none}.main{margin-left:0;width:100%;padding:10px;padding-bottom:76px}.topbar{border-radius:0 0 14px 14px;margin:-10px -10px 12px;padding:0 15px}.topbar h1{font-size:17px}.hero{min-height:155px;padding:17px}.kpis{grid-template-columns:repeat(2,1fr)}.quick{grid-template-columns:repeat(2,1fr)}.quick button{padding:12px}.area-grid,.form-grid,.summary{grid-template-columns:1fr}.field.full{grid-column:auto}.item{align-items:flex-start}.item .stock{margin-left:auto}.bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;height:64px;background:#fff;border-top:1px solid var(--line);z-index:30}.bottomnav button{background:#fff;color:#6c7f91;font-size:10px;font-weight:700}.bottomnav button.active{color:var(--blue)}.bottomnav span{display:block;font-size:20px;margin-bottom:2px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><div class="brand-mark">〰️</div><strong>AQUAVILLE</strong><small>CONDOMÍNIO</small><span class="lab">ALMOX LAB</span></div><nav class="nav" id="sideNav"></nav><div class="userbox"><div class="avatar">A</div><div><b>Administrador</b><br><span>Laboratório</span></div></div></aside><main class="main"><header class="topbar"><div><h1>Almoxarifado Aquaville</h1><p>ALMOX LAB · ambiente de testes</p></div><div class="top-actions"><button class="iconbtn" data-go="backup">💾</button><button class="iconbtn" data-go="mais">⋮</button></div></header><section id="inicio" class="page active"></section><section id="materiais" class="page"></section><section id="contagem" class="page"></section><section id="compras" class="page"></section><section id="fornecedores" class="page"></section><section id="cadastro" class="page"></section><section id="backup" class="page"></section><section id="mais" class="page"></section></main></div><nav class="bottomnav" id="bottomNav"></nav><div class="toast" id="toast"></div><script>
const KEY='almox-lab-dados-v1';const areas=[['🧹','Limpeza'],['⚡','Elétrica'],['💧','Hidráulica'],['🛠️','Ferramentas'],['🦺','EPI'],['🧱','Construção'],['🎨','Pintura'],['🌿','Jardinagem'],['〰️','Piscina'],['🛡️','Segurança'],['📁','Escritório'],['⚙️','Manutenção'],['🚒','Incêndio e Emergência'],['♻️','Resíduos'],['🔧','Peças de Reposição'],['🏠','Impermeabilização e Cobertura'],['📹','Comunicação e CFTV'],['🔌','Equipamentos e Máquinas'],['🏊','Áreas Comuns'],['📦','Outros']];const seed=[['LP-001','Álcool 70%','UN',12,5,20,'Limpeza','Higiene','🧴'],['LP-002','Álcool Gel 5L','UN',8,5,20,'Limpeza','Higiene','🧴'],['LP-003','Água Sanitária','L',24,10,30,'Limpeza','Químicos','🧴'],['LP-004','Amaciante','L',6,8,20,'Limpeza','Lavanderia','🧴'],['LP-005','Aromatizante','UN',15,5,20,'Limpeza','Aromatização','🧴'],['LP-006','Balde','UN',10,4,15,'Limpeza','Utensílios','🪣'],['LP-007','Desinfetante','L',18,8,30,'Limpeza','Químicos','🧴'],['LP-008','Detergente','L',9,10,25,'Limpeza','Químicos','🧴']];function fresh(){return{materials:seed.map((p,i)=>({id:'m'+(i+1),code:p[0],name:p[1],unit:p[2],stock:p[3],min:p[4],ideal:p[5],area:p[6],subgroup:p[7],category:'',supplier:'',supplierId:'',location:'',notes:'',image:p[8],lastCount:null})),suppliers:[],movements:[],deliveryNotes:[],budgets:[],history:[],settings:{company:'Condomínio Aquaville'}}}function load(){try{let saved=JSON.parse(localStorage.getItem(KEY)||'{}');let base=fresh();let d=Object.assign(base,saved);d.suppliers=Array.isArray(d.suppliers)?d.suppliers:[];d.materials=Array.isArray(d.materials)?d.materials:base.materials;d.materials.forEach(m=>{if(!m.supplierId)m.supplierId=''});return d}catch(e){return fresh()}}let db=load(),countState=null,currentArea='Todos',currentSub='Todos',supplierEditingId=null;function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function buy(m){return Math.max(Number(m.ideal||0)-Number(m.stock||0),0)}function status(m){return m.stock<=m.min?'critical':m.stock<m.ideal?'warn':'ok'}function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900)}function download(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function backup(){download('backup-almoxarifado-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2));toast('Backup exportado com os dados atuais')}function supplierName(m){if(m.supplierId){let s=db.suppliers.find(x=>x.id===m.supplierId);if(s)return s.name}return m.supplier||'Sem fornecedor'}function supplierOptions(selected=''){return '<option value="">Sem fornecedor</option>'+db.suppliers.map(s=>`<option value="${esc(s.id)}" ${s.id===selected?'selected':''}>${esc(s.name)}</option>`).join('')}const nav=[['inicio','⌂','Início'],['materiais','▣','Materiais'],['contagem','▤','Contagem'],['compras','🛒','Reposição'],['fornecedores','🏭','Fornecedores'],['cadastro','＋','Adicionar item'],['backup','💾','Backup'],['mais','⚙','Mais']];function nbtn(n){return`<button data-go="${n[0]}"><span>${n[1]}</span>${n[2]}</button>`}sideNav.innerHTML=nav.map(nbtn).join('');bottomNav.innerHTML=[['inicio','⌂','Início'],['materiais','▣','Materiais'],['contagem','▤','Contagem'],['compras','🛒','Compras'],['mais','•••','Mais']].map(nbtn).join('');function list(filter='',area='Todos',sub='Todos'){return db.materials.filter(m=>(area==='Todos'||m.area===area)&&(sub==='Todos'||m.subgroup===sub)&&(`${m.name} ${m.code} ${m.area} ${m.subgroup}`.toLowerCase().includes(filter.toLowerCase()))).map(m=>`<div class="item"><div class="item-img">${esc(m.image)||'📦'}</div><div class="item-info"><small>${esc(m.code)} · ${esc(m.area)}</small><strong>${esc(m.name)}</strong><small>${esc(m.unit)} · ${esc(m.subgroup||'Sem subgrupo')} · ${esc(supplierName(m))}</small></div><span class="stock ${status(m)}">Estoque: ${m.stock}</span></div>`).join('')||'<div class="empty">Nenhum material encontrado.</div>'}function renderHome(){let total=db.materials.length,crit=db.materials.filter(m=>status(m)==='critical').length,repl=db.materials.filter(m=>buy(m)>0).length,ok=total?Math.round(db.materials.filter(m=>status(m)==='ok').length/total*100):0;inicio.innerHTML=`<div class="hero"><div><h2>Bem-vindo ao Almoxarifado Aquaville</h2><p>Controle hoje, menos imprevistos amanhã.</p></div></div><div class="kpis"><div class="kpi blue"><small>Materiais cadastrados</small><div class="num">${total}</div></div><div class="kpi red"><small>Itens em estoque crítico</small><div class="num">${crit}</div></div><div class="kpi yellow"><small>Itens para reposição</small><div class="num">${repl}</div></div><div class="kpi green"><small>Itens em situação OK</small><div class="num">${ok}%</div></div></div><div class="quick"><button data-go="contagem"><span class="qicon">▤</span>Realizar<br>Contagem</button><button data-go="cadastro"><span class="qicon">＋</span>Adicionar<br>Material</button><button data-go="compras"><span class="qicon">🛒</span>Ver<br>Reposição</button><button data-go="backup"><span class="qicon">💾</span>Exportar<br>Backup</button></div>`}function renderMaterials(){materiais.innerHTML=`<div class="section-title"><h2>Materiais</h2><button class="primary" data-go="cadastro">＋ Adicionar item</button></div><div class="card"><div class="toolbar"><input id="search" class="search" placeholder="🔍 Pesquisar por nome, código ou palavra-chave..."><select id="areaFilter"><option>Todos</option>${areas.map(a=>`<option>${esc(a[1])}</option>`).join('')}</select><select id="subFilter"><option>Todos</option></select></div><div class="list" id="productList">${list()}</div></div>`;updateSub()}function updateSub(){let af=document.getElementById('areaFilter'),sf=document.getElementById('subFilter');if(!af||!sf)return;let subs=[...new Set(db.materials.filter(m=>af.value==='Todos'||m.area===af.value).map(m=>m.subgroup).filter(Boolean))].sort();sf.innerHTML='<option>Todos</option>'+subs.map(s=>`<option>${esc(s)}</option>`).join('');renderMaterialList()}function renderMaterialList(){let l=document.getElementById('productList');if(l)l.innerHTML=list(document.getElementById('search')?.value||'',document.getElementById('areaFilter')?.value||'Todos',document.getElementById('subFilter')?.value||'Todos')}function startCount(){countState={};db.materials.forEach(m=>countState[m.id]={status:'pending',qty:m.stock});currentArea='Todos';currentSub='Todos';renderCount()}function renderCount(){if(!countState)startCount();let total=db.materials.length,counted=Object.values(countState).filter(x=>x.status==='counted').length,subs=[...new Set(db.materials.filter(m=>currentArea==='Todos'||m.area===currentArea).map(m=>m.subgroup).filter(Boolean))].sort(),q=(document.getElementById('countSearch')?.value||'').toLowerCase(),items=db.materials.filter(m=>(currentArea==='Todos'||m.area===currentArea)&&(currentSub==='Todos'||m.subgroup===currentSub)&&(`${m.name} ${m.code}`.toLowerCase().includes(q)));contagem.innerHTML=`<div class="card"><div class="count-head"><div><h2 style="margin:0">Realizar Contagem</h2><small class="muted">Selecione uma área e confira os itens</small></div><span class="stock ${counted<total?'warn':'ok'}">${counted} de ${total}</span></div><div class="steps"><div class="step active"><b>1</b>Selecionar</div><div class="step active"><b>2</b>Conferir</div><div class="step"><b>3</b>Finalizar</div></div><div class="toolbar"><select id="countArea"><option>Todos</option>${areas.map(a=>`<option ${a[1]===currentArea?'selected':''}>${esc(a[1])}</option>`).join('')}</select><select id="countSub"><option>Todos</option>${subs.map(s=>`<option ${s===currentSub?'selected':''}>${esc(s)}</option>`).join('')}</select><input id="countSearch" class="search" value="${esc(q)}" placeholder="🔍 Pesquisar opcionalmente..."></div><div class="progress"><i style="width:${total?counted/total*100:0}%"></i></div><p class="muted" style="font-size:12px">${counted} contados · ${total-counted} pendentes</p></div><div class="card" style="margin-top:12px"><div class="section-title"><h2>Itens: ${esc(currentArea)}</h2><button class="secondary" id="newCount">Nova contagem</button></div><div class="list">${items.map(m=>{let c=countState[m.id];return`<div class="item"><input class="check count-check" data-id="${m.id}" type="checkbox" ${c.status==='counted'?'checked':''}><div class="item-img">${esc(m.image)||'📦'}</div><div class="item-info"><small>${esc(m.code)}</small><strong>${esc(m.name)}</strong><small>Atual: ${m.stock} · Ideal: ${m.ideal} · Mín.: ${m.min} · Comprar: ${c.status==='counted'?Math.max(m.ideal-Number(c.qty),0):buy(m)}</small></div><input class="qty count-qty" data-id="${m.id}" value="${c.status==='counted'?esc(c.qty):''}" placeholder="Qtd" inputmode="numeric" min="0"></div>`}).join('')||'<div class="empty">Nenhum material nesta seleção.</div>'}</div><div class="actions" style="margin-top:14px"><button class="primary" id="saveCount">Salvar contagem</button><button class="secondary" id="finishCount">Finalizar contagem</button></div></div>`}function saveCount(){document.querySelectorAll('.count-qty').forEach(i=>{let id=i.dataset.id,ch=document.querySelector(`.count-check[data-id="${id}"]`)?.checked;if(ch&&i.value.trim()!==''){let n=Number(i.value);if(Number.isFinite(n)&&n>=0)countState[id]={status:'counted',qty:n}}});document.querySelectorAll('.count-check').forEach(c=>{if(!c.checked)countState[c.dataset.id]={status:'pending',qty:db.materials.find(m=>m.id===c.dataset.id)?.stock||0}});renderCount();toast('Contagem salva')}function finishCount(){saveCount();let done=Object.entries(countState).filter(([,x])=>x.status==='counted');if(!done.length){toast('Nenhum item contado');return}done.forEach(([id,x])=>{let m=db.materials.find(m=>m.id===id);if(m){m.stock=Number(x.qty);m.lastCount=new Date().toISOString();db.history.push({type:'count',materialId:id,qty:m.stock,date:m.lastCount})}});save();countState=null;renderAll();go('contagem');toast(`${done.length} item(ns) atualizados`)}function renderCadastro(){cadastro.innerHTML=`<div class="section-title"><div><h2>Adicionar material</h2><span class="muted">Cadastro da Fase 1</span></div></div><div class="card"><form id="materialForm"><div class="form-grid"><div class="field"><label>Código</label><input name="code" placeholder="Ex.: MAT-009"></div><div class="field"><label>Nome *</label><input name="name" required></div><div class="field"><label>Categoria</label><input name="category"></div><div class="field"><label>Área *</label><select name="area">${areas.map(a=>`<option>${esc(a[1])}</option>`).join('')}</select></div><div class="field"><label>Subgrupo</label><input name="subgroup"></div><div class="field"><label>Unidade</label><select name="unit"><option>UN</option><option>CX</option><option>PCT</option><option>RESMA</option><option>L</option><option>KG</option><option>GALÃO</option><option>ROLO</option></select></div><div class="field"><label>Estoque atual</label><input name="stock" type="number" min="0" value="0"></div><div class="field"><label>Estoque mínimo</label><input name="min" type="number" min="0" value="0"></div><div class="field"><label>Estoque ideal</label><input name="ideal" type="number" min="0" value="0"></div><div class="field"><label>Fornecedor</label><select name="supplierId">${supplierOptions()}</select></div><div class="field"><label>Localização</label><input name="location"></div><div class="field"><label>Imagem</label><input name="image" placeholder="Emoji opcional"></div><div class="field full"><label>Observações</label><textarea name="notes"></textarea></div></div><div class="actions" style="margin-top:15px"><button class="primary">Salvar material</button><button type="button" class="secondary" data-go="materiais">Cancelar</button></div></form></div>`}function addMaterial(e){e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')||'').trim(),stock=Number(f.get('stock')||0),min=Number(f.get('min')||0),ideal=Number(f.get('ideal')||0),supplierId=String(f.get('supplierId')||''),sup=db.suppliers.find(s=>s.id===supplierId);if(!name)return toast('Nome é obrigatório');if([stock,min,ideal].some(n=>!Number.isFinite(n)||n<0))return toast('Estoques devem ser não negativos');if(min>ideal)return toast('Mínimo não pode ser maior que o ideal');let id='m'+Date.now();db.materials.push({id,code:String(f.get('code')||'').trim()||'MAT-'+String(db.materials.length+1).padStart(3,'0'),name,category:String(f.get('category')||''),area:String(f.get('area')||'Outros'),subgroup:String(f.get('subgroup')||''),unit:String(f.get('unit')||'UN'),stock,min,ideal,supplier:sup?.name||'',supplierId,location:String(f.get('location')||''),image:String(f.get('image')||'📦'),notes:String(f.get('notes')||''),lastCount:null});db.history.push({type:'create',materialId:id,date:new Date().toISOString()});save();renderAll();go('materiais');toast('Material adicionado e persistido')}function renderCompras(){let a=db.materials.filter(m=>buy(m)>0);compras.innerHTML=`<div class="section-title"><h2>Reposição</h2><span class="muted">Ideal − estoque atual</span></div><div class="card"><div class="list">${a.map(m=>`<div class="item"><div class="item-img">${esc(m.image)||'📦'}</div><div class="item-info"><small>${esc(m.code)} · ${esc(m.area)}</small><strong>${esc(m.name)}</strong><small>Atual: ${m.stock} · Ideal: ${m.ideal} · Fornecedor: ${esc(supplierName(m))}</small></div><span class="stock ${status(m)}">Comprar ${buy(m)}</span></div>`).join('')||'<div class="empty">Nenhum material precisa de reposição.</div>'}</div></div>`}function renderFornecedores(){let q=(document.getElementById('supplierSearch')?.value||'').toLowerCase();let items=db.suppliers.filter(s=>`${s.name} ${s.cnpj} ${s.phone} ${s.whatsapp} ${s.email} ${s.purpose}`.toLowerCase().includes(q));fornecedores.innerHTML=`<div class="section-title"><div><h2>Fornecedores</h2><span class="muted">Cadastro e vínculo com materiais</span></div><button class="primary" id="newSupplier">＋ Novo fornecedor</button></div><div class="card"><div class="toolbar"><input id="supplierSearch" class="search" value="${esc(q)}" placeholder="🔍 Pesquisar fornecedor, CNPJ, telefone ou finalidade..."></div><div class="list">${items.map(s=>{let linked=db.materials.filter(m=>m.supplierId===s.id||(m.supplierId===''&&m.supplier===s.name)).length;return`<div class="item"><div class="item-img">${esc(s.image)||'🏭'}</div><div class="item-info"><small>${esc(s.cnpj||'CNPJ não informado')} · ${esc(s.purpose||'Finalidade não informada')}</small><strong>${esc(s.name)}</strong><small>${esc(s.phone||s.whatsapp||s.email||'Contato não informado')} · ${linked} material(is) vinculado(s)</small></div><div class="actions"><button class="secondary supplier-edit" data-id="${esc(s.id)}">Editar</button><button class="danger supplier-delete" data-id="${esc(s.id)}">Excluir</button></div></div>`}).join('')||'<div class="empty">Nenhum fornecedor cadastrado.</div>'}</div></div>${supplierEditingId?supplierFormHtml(db.suppliers.find(s=>s.id===supplierEditingId)):''}`}function supplierFormHtml(s){s=s||{id:'',name:'',cnpj:'',phone:'',whatsapp:'',email:'',address:'',contact:'',purpose:'',notes:'',image:''};return`<div class="card" style="margin-top:12px"><div class="section-title"><div><h2>${s.id?'Editar fornecedor':'Novo fornecedor'}</h2><span class="muted">Informações comerciais do fornecedor</span></div><button class="secondary" id="cancelSupplier">Fechar</button></div><form id="supplierForm"><input type="hidden" name="id" value="${esc(s.id)}"><div class="form-grid"><div class="field"><label>Nome / Razão Social *</label><input name="name" required value="${esc(s.name)}"></div><div class="field"><label>CNPJ</label><input name="cnpj" value="${esc(s.cnpj)}" placeholder="00.000.000/0000-00"></div><div class="field"><label>Telefone</label><input name="phone" value="${esc(s.phone)}"></div><div class="field"><label>WhatsApp</label><input name="whatsapp" value="${esc(s.whatsapp)}"></div><div class="field"><label>E-mail</label><input name="email" type="email" value="${esc(s.email)}"></div><div class="field"><label>Contato responsável</label><input name="contact" value="${esc(s.contact)}"></div><div class="field full"><label>Endereço</label><input name="address" value="${esc(s.address)}"></div><div class="field"><label>Finalidade</label><input name="purpose" list="supplierPurposes" value="${esc(s.purpose)}" placeholder="Ex.: Material de limpeza"><datalist id="supplierPurposes"><option value="Material de limpeza"><option value="Material elétrico"><option value="Material hidráulico"><option value="Ferramentas"><option value="EPI"><option value="Construção"><option value="Pintura"><option value="Jardinagem"><option value="Piscina"><option value="Manutenção"><option value="Escritório"><option value="Serviços"></datalist></div><div class="field"><label>Imagem / Logo</label><input name="image" value="${esc(s.image)}" placeholder="Emoji ou referência da logo"></div><div class="field full"><label>Observações</label><textarea name="notes">${esc(s.notes)}</textarea></div></div><div class="actions" style="margin-top:15px"><button class="primary">${s.id?'Salvar alterações':'Cadastrar fornecedor'}</button></div></form></div>`}function openSupplier(id=''){supplierEditingId=id||'new';renderFornecedores();setTimeout(()=>document.querySelector('#supplierForm input[name="name"]')?.focus(),50)}function saveSupplier(e){e.preventDefault();let f=new FormData(e.target),id=String(f.get('id')||''),name=String(f.get('name')||'').trim();if(!name)return toast('Nome do fornecedor é obrigatório');let data={id:id||'s'+Date.now(),name,cnpj:String(f.get('cnpj')||'').trim(),phone:String(f.get('phone')||'').trim(),whatsapp:String(f.get('whatsapp')||'').trim(),email:String(f.get('email')||'').trim(),address:String(f.get('address')||'').trim(),contact:String(f.get('contact')||'').trim(),purpose:String(f.get('purpose')||'').trim(),notes:String(f.get('notes')||'').trim(),image:String(f.get('image')||'').trim()};if(id){let i=db.suppliers.findIndex(s=>s.id===id);if(i>=0)db.suppliers[i]=data}else db.suppliers.push(data);db.materials.forEach(m=>{if(m.supplierId===data.id)m.supplier=data.name});db.history.push({type:id?'supplier_update':'supplier_create',supplierId:data.id,date:new Date().toISOString()});save();supplierEditingId=null;renderAll();go('fornecedores');toast(id?'Fornecedor atualizado':'Fornecedor cadastrado')}function deleteSupplier(id){let s=db.suppliers.find(x=>x.id===id);if(!s)return;let linked=db.materials.filter(m=>m.supplierId===id||(m.supplierId===''&&m.supplier===s.name));let msg=linked.length?`O fornecedor "${s.name}" possui ${linked.length} material(is) vinculado(s). O cadastro será removido, mas os materiais serão preservados. Continuar?`:`Excluir o fornecedor "${s.name}"?`;if(!confirm(msg))return;db.materials.forEach(m=>{if(m.supplierId===id)m.supplierId=''});db.suppliers=db.suppliers.filter(x=>x.id!==id);db.history.push({type:'supplier_delete',supplierId:id,date:new Date().toISOString()});save();renderAll();go('fornecedores');toast('Fornecedor removido; materiais preservados')}function renderCadastro(){cadastro.innerHTML=`<div class="section-title"><div><h2>Adicionar material</h2><span class="muted">Cadastro da Fase 1</span></div></div><div class="card"><form id="materialForm"><div class="form-grid"><div class="field"><label>Código</label><input name="code" placeholder="Ex.: MAT-009"></div><div class="field"><label>Nome *</label><input name="name" required></div><div class="field"><label>Categoria</label><input name="category"></div><div class="field"><label>Área *</label><select name="area">${areas.map(a=>`<option>${esc(a[1])}</option>`).join('')}</select></div><div class="field"><label>Subgrupo</label><input name="subgroup"></div><div class="field"><label>Unidade</label><select name="unit"><option>UN</option><option>CX</option><option>PCT</option><option>RESMA</option><option>L</option><option>KG</option><option>GALÃO</option><option>ROLO</option></select></div><div class="field"><label>Estoque atual</label><input name="stock" type="number" min="0" value="0"></div><div class="field"><label>Estoque mínimo</label><input name="min" type="number" min="0" value="0"></div><div class="field"><label>Estoque ideal</label><input name="ideal" type="number" min="0" value="0"></div><div class="field"><label>Fornecedor</label><select name="supplierId">${supplierOptions()}</select></div><div class="field"><label>Localização</label><input name="location"></div><div class="field"><label>Imagem</label><input name="image" placeholder="Emoji opcional"></div><div class="field full"><label>Observações</label><textarea name="notes"></textarea></div></div><div class="actions" style="margin-top:15px"><button class="primary">Salvar material</button><button type="button" class="secondary" data-go="materiais">Cancelar</button></div></form></div>`}function addMaterial(e){e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')||'').trim(),stock=Number(f.get('stock')||0),min=Number(f.get('min')||0),ideal=Number(f.get('ideal')||0),supplierId=String(f.get('supplierId')||''),sup=db.suppliers.find(s=>s.id===supplierId);if(!name)return toast('Nome é obrigatório');if([stock,min,ideal].some(n=>!Number.isFinite(n)||n<0))return toast('Estoques devem ser não negativos');if(min>ideal)return toast('Mínimo não pode ser maior que o ideal');let id='m'+Date.now();db.materials.push({id,code:String(f.get('code')||'').trim()||'MAT-'+String(db.materials.length+1).padStart(3,'0'),name,category:String(f.get('category')||''),area:String(f.get('area')||'Outros'),subgroup:String(f.get('subgroup')||''),unit:String(f.get('unit')||'UN'),stock,min,ideal,supplier:sup?.name||'',supplierId,location:String(f.get('location')||''),image:String(f.get('image')||'📦'),notes:String(f.get('notes')||''),lastCount:null});db.history.push({type:'create',materialId:id,date:new Date().toISOString()});save();renderAll();go('materiais');toast('Material adicionado e persistido')}function renderCompras(){let a=db.materials.filter(m=>buy(m)>0);compras.innerHTML=`<div class="section-title"><h2>Reposição</h2><span class="muted">Ideal − estoque atual</span></div><div class="card"><div class="list">${a.map(m=>`<div class="item"><div class="item-img">${esc(m.image)||'📦'}</div><div class="item-info"><small>${esc(m.code)} · ${esc(m.area)}</small><strong>${esc(m.name)}</strong><small>Atual: ${m.stock} · Ideal: ${m.ideal} · Fornecedor: ${esc(supplierName(m))}</small></div><span class="stock ${status(m)}">Comprar ${buy(m)}</span></div>`).join('')||'<div class="empty">Nenhum material precisa de reposição.</div>'}</div></div>`}function renderBackup(){backup.innerHTML=`<div class="section-title"><h2>Backup dos dados</h2></div><div class="card"><div class="summary"><div class="summary-box"><small>Materiais</small><b>${db.materials.length}</b></div><div class="summary-box"><small>Histórico</small><b>${db.history.length}</b></div><div class="summary-box"><small>Fornecedores</small><b>${db.suppliers.length}</b></div></div><p>Exporta os dados atuais do ALMOX LAB em JSON, incluindo materiais, fornecedores, movimentações, notas de entrega, orçamentos, histórico e configurações.</p><div class="actions"><button class="primary" id="exportBtn">💾 Exportar backup JSON</button><label class="secondary" style="display:inline-flex;align-items:center;cursor:pointer">📥 Importar backup<input id="importBackup" type="file" accept="application/json,.json" hidden></label></div></div>`}function importBackup(e){let file=e.target.files?.[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d||!Array.isArray(d.materials))throw Error('backup inválido');if(!Array.isArray(d.suppliers))d.suppliers=[];db=Object.assign(fresh(),d);db.materials.forEach(m=>{if(!m.supplierId)m.supplierId=''});save();renderAll();go('backup');toast('Backup importado com sucesso')}catch(err){toast('Arquivo de backup inválido')}};r.readAsText(file)}function renderMais(){mais.innerHTML=`<div class="section-title"><h2>Mais opções</h2></div><div class="area-grid"><button class="area" data-go="fornecedores"><span class="emoji">🏭</span><span><strong>Fornecedores</strong><small>Cadastro e vínculos</small></span></button><button class="area" data-go="cadastro"><span class="emoji">＋</span><span><strong>Adicionar material</strong><small>Novo item</small></span></button><button class="area" data-go="backup"><span class="emoji">💾</span><span><strong>Backup</strong><small>Exportar e importar dados</small></span></button><button class="area" data-go="materiais"><span class="emoji">▣</span><span><strong>Materiais</strong><small>Consultar catálogo</small></span></button></div>`}function renderAll(){renderHome();renderMaterials();renderCadastro();renderCompras();renderFornecedores();renderBackup();renderMais();if(countState)renderCount();else startCount()}function go(id){if(!document.getElementById(id))id='mais';document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===id));scrollTo(0,0)}document.addEventListener('click',e=>{let g=e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go);return}if(e.target.id==='exportBtn')backup();if(e.target.id==='newCount')startCount();if(e.target.id==='saveCount')saveCount();if(e.target.id==='finishCount')finishCount();if(e.target.id==='newSupplier')openSupplier();if(e.target.id==='cancelSupplier'){supplierEditingId=null;renderFornecedores()}let edit=e.target.closest('.supplier-edit');if(edit)openSupplier(edit.dataset.id);let del=e.target.closest('.supplier-delete');if(del)deleteSupplier(del.dataset.id)});document.addEventListener('input',e=>{if(e.target.id==='search')renderMaterialList();if(e.target.id==='countSearch')renderCount();if(e.target.id==='supplierSearch')renderFornecedores()});document.addEventListener('change',e=>{if(e.target.id==='areaFilter'){updateSub();return}if(e.target.id==='subFilter'){renderMaterialList();return}if(e.target.id==='countArea'){currentArea=e.target.value;currentSub='Todos';renderCount();return}if(e.target.id==='countSub'){currentSub=e.target.value;renderCount();return}if(e.target.classList.contains('count-check')&&e.target.checked)document.querySelector(`.count-qty[data-id="${e.target.dataset.id}"]`)?.focus();if(e.target.id==='importBackup')importBackup(e)});document.addEventListener('submit',e=>{if(e.target.id==='materialForm')addMaterial(e);if(e.target.id==='supplierForm')saveSupplier(e)});renderAll();go('inicio');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
