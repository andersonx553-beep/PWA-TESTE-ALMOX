<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0876c9">
<link rel="manifest" href="manifest.json">
<title>Almoxarifado Aquaville — PWA Teste</title>
<style>
:root{--blue:#0876c9;--blue2:#075a9c;--navy:#082b45;--bg:#f4f8fc;--card:#fff;--text:#12243a;--muted:#718096;--line:#e2eaf2;--green:#18a957;--yellow:#f5b400;--red:#ef4444;--shadow:0 8px 24px rgba(25,70,105,.10)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{border:0;cursor:pointer}.app{min-height:100vh;display:flex}.sidebar{width:235px;background:linear-gradient(180deg,#06283f,#071c2c);color:#fff;padding:20px 12px;position:fixed;inset:0 auto 0 0;z-index:20}.brand{text-align:center;padding:10px 8px 24px}.brand-mark{font-size:42px;line-height:1}.brand strong{display:block;letter-spacing:2px;font-size:18px}.brand small{opacity:.7}.nav button{width:100%;display:flex;align-items:center;gap:12px;background:transparent;color:#dbe9f5;text-align:left;padding:12px 13px;border-radius:10px;margin:3px 0;font-weight:700}.nav button.active,.nav button:hover{background:linear-gradient(90deg,#0c86d9,#086ab3);color:#fff}.userbox{position:absolute;bottom:16px;left:14px;right:14px;padding:12px;background:rgba(255,255,255,.08);border-radius:12px;display:flex;gap:10px;align-items:center;font-size:12px}.avatar{width:34px;height:34px;border-radius:50%;background:#e8f4ff;color:#075a9c;display:grid;place-items:center;font-weight:800}.main{margin-left:235px;width:calc(100% - 235px);padding:18px;max-width:1500px}.topbar{height:62px;background:linear-gradient(100deg,var(--blue2),var(--blue));border-radius:14px;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;margin-bottom:16px;box-shadow:var(--shadow)}.topbar h1{font-size:20px;margin:0}.topbar p{font-size:11px;margin:3px 0 0;opacity:.85}.top-actions{display:flex;gap:8px}.iconbtn{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.15);color:#fff}.page{display:none}.page.active{display:block}.hero{border-radius:16px;min-height:185px;background:linear-gradient(100deg,rgba(4,46,73,.72),rgba(5,80,125,.18)),url('https://images.unsplash.com/photo-1564501049412-61c2a3083791?auto=format&fit=crop&w=1400&q=80') center/cover;display:flex;align-items:flex-end;padding:22px;color:#fff;box-shadow:var(--shadow)}.hero h2{margin:0;font-size:22px}.hero p{margin:5px 0 0;font-size:13px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}.kpi .num{font-size:28px;font-weight:850;margin:6px 0}.kpi small{color:var(--muted)}.kpi.blue .num{color:var(--blue)}.kpi.red .num{color:var(--red)}.kpi.yellow .num{color:#d58b00}.kpi.green .num{color:var(--green)}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}.quick button{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;text-align:left;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);color:var(--text);font-weight:800}.quick .qicon{width:48px;height:48px;border-radius:12px;background:#e8f4ff;color:var(--blue);display:grid;place-items:center;font-size:24px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}.section-title h2{font-size:21px;margin:0}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:var(--shadow)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}.search{flex:1;min-width:230px;border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:#fff;outline:none}.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(8,118,201,.10)}select{border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff}.area-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.area{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);background:#fff;border-radius:12px;text-align:left}.area:hover,.area.selected{border-color:#86bfe8;background:#f3f9ff}.emoji{font-size:24px;width:32px;text-align:center}.area strong{display:block}.area small{color:var(--muted)}.list{display:grid;gap:8px}.item{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff}.item-img{width:44px;height:44px;border-radius:9px;background:#eef4f8;display:grid;place-items:center;font-size:25px;flex:none}.item-info{min-width:0;flex:1}.item-info strong{display:block;font-size:14px}.item-info small{color:var(--muted)}.stock{padding:6px 9px;border-radius:8px;font-size:11px;font-weight:850;white-space:nowrap}.stock.ok{background:#dff6e9;color:#08753d}.stock.warn{background:#fff0bd;color:#8a6300}.stock.critical{background:#ffdfe0;color:#c62828}.arrow{color:#7b8c9d;font-size:20px}.count-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.steps{display:flex;justify-content:space-around;margin:6px 0 16px}.step{text-align:center;font-size:11px;color:#8b9bad}.step b{display:grid;place-items:center;width:26px;height:26px;margin:auto auto 5px;border-radius:50%;background:#dce5ee;color:#60758a}.step.active{color:var(--blue);font-weight:800}.step.active b{background:var(--blue);color:#fff}.count-list .item{padding:9px}.check{width:21px;height:21px;accent-color:var(--green)}.qty{width:68px;border:1px solid #d4e0eb;border-radius:9px;padding:9px;text-align:center;font-weight:800}.progress{height:8px;background:#e5edf4;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#21b96d;border-radius:99px}.detail{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail .big{grid-column:1/-1}.metric{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.metric:last-child{border:0}.primary{background:linear-gradient(100deg,#0876c9,#0a8be0);color:#fff;border-radius:11px;padding:12px 16px;font-weight:800}.secondary{background:#eaf1f7;color:#17324b;border-radius:11px;padding:12px 16px;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap}.report-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}.status-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}.status-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}.green{background:var(--green)}.yellow{background:var(--yellow)}.red{background:var(--red)}.toast{position:fixed;right:20px;bottom:20px;background:#102b40;color:#fff;padding:13px 16px;border-radius:11px;box-shadow:var(--shadow);display:none;z-index:50}.toast.show{display:block}.bottomnav{display:none}
@media(max-width:850px){.sidebar{display:none}.main{margin-left:0;width:100%;padding:10px;padding-bottom:76px}.topbar{border-radius:0 0 14px 14px;margin:-10px -10px 12px;padding:0 15px}.topbar h1{font-size:17px}.hero{min-height:155px;padding:17px}.kpis{grid-template-columns:repeat(2,1fr)}.quick{grid-template-columns:repeat(2,1fr)}.quick button{padding:12px}.area-grid{grid-template-columns:repeat(2,1fr)}.detail,.report-grid{grid-template-columns:1fr}.bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;height:64px;background:#fff;border-top:1px solid var(--line);z-index:30}.bottomnav button{background:#fff;color:#6c7f91;font-size:10px;font-weight:700}.bottomnav button.active{color:var(--blue)}.bottomnav span{display:block;font-size:20px;margin-bottom:2px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand"><div class="brand-mark">〰️</div><strong>AQUAVILLE</strong><small>CONDOMÍNIO</small></div><nav class="nav" id="sideNav"></nav><div class="userbox"><div class="avatar">A</div><div><b>Administrador</b><br><span>Almoxarifado</span></div></div></aside>
<main class="main"><header class="topbar"><div><h1>Almoxarifado Aquaville</h1><p>Controle inteligente para um condomínio mais eficiente</p></div><div class="top-actions"><button class="iconbtn">🔔</button><button class="iconbtn">⋮</button></div></header>
<section id="inicio" class="page active"></section>
<section id="materiais" class="page"></section>
<section id="contagem" class="page"></section>
<section id="compras" class="page"></section>
<section id="mais" class="page"></section>
</main>
</div>
<nav class="bottomnav" id="bottomNav"></nav><div class="toast" id="toast"></div>
<script>
const areas=[['🧹','Limpeza',43],['⚡','Elétrica',38],['💧','Hidráulica',27],['🛠️','Ferramentas',31],['🦺','EPI',18],['🧱','Construção',26],['🎨','Pintura',19],['🌿','Jardinagem',24],['〰️','Piscina',22],['🛡️','Segurança',16],['📁','Escritório',28],['⚙️','Manutenção',41],['🚒','Incêndio',12],['♻️','Resíduos',9],['🔧','Peças de Reposição',14],['🏠','Impermeabilização e Cobertura',11],['📹','Comunicação e CFTV',13],['🔌','Equipamentos e Máquinas',15],['🏊','Áreas Comuns',10],['📦','Outros',8]];
const products=[['LP-001','Álcool 70%','L',12,'warn','🧴'],['LP-002','Álcool Gel 5L','UN',8,'critical','🧴'],['LP-003','Água Sanitária','L',24,'ok','🧴'],['LP-004','Amaciante','L',6,'critical','🧴'],['LP-005','Aromatizante','UN',15,'warn','🧴'],['LP-006','Balde','UN',10,'ok','🪣'],['LP-007','Desinfetante','L',18,'ok','🧴'],['LP-008','Detergente','L',9,'warn','🧴']];
const nav=[['inicio','⌂','Início'],['materiais','▣','Materiais'],['mov','⇄','Movimentações'],['contagem','▤','Contagem'],['compras','🛒','Reposição'],['compras','▣','Lista de Compras'],['forn','♟','Fornecedores'],['rel','▤','Relatórios'],['mais','⚙','Configurações']];
function navButton(n){return `<button data-go="${n[0]}"><span>${n[1]}</span>${n[2]}</button>`}
document.getElementById('sideNav').innerHTML=nav.map(navButton).join('');
document.getElementById('bottomNav').innerHTML=[['inicio','⌂','Início'],['materiais','▣','Materiais'],['contagem','▤','Contagem'],['compras','🛒','Compras'],['mais','•••','Mais']].map(n=>`<button data-go="${n[0]}"><span>${n[1]}</span>${n[2]}</button>`).join('');
function productList(filter=''){return products.filter(p=>p[1].toLowerCase().includes(filter.toLowerCase())).map(p=>`<div class="item"><div class="item-img">${p[5]}</div><div class="item-info"><small>${p[0]}</small><strong>${p[1]}</strong><small>${p[2]}</small></div><span class="stock ${p[4]}">Estoque: ${p[3]}</span><span class="arrow">›</span></div>`).join('')}
function render(){
document.getElementById('inicio').innerHTML=`<div class="hero"><div><h2>Bem-vindo ao Almoxarifado Aquaville</h2><p>Controle hoje, menos imprevistos amanhã.</p></div></div><div class="kpis"><div class="kpi blue"><small>Materiais cadastrados</small><div class="num">452</div></div><div class="kpi red"><small>Itens em estoque crítico</small><div class="num">12</div></div><div class="kpi yellow"><small>Itens para reposição</small><div class="num">28</div></div><div class="kpi green"><small>Itens em situação OK</small><div class="num">96%</div></div></div><div class="quick"><button data-go="contagem"><span class="qicon">▤</span>Realizar<br>Contagem</button><button data-go="mov"><span class="qicon">⇄</span>Nova<br>Movimentação</button><button data-go="compras"><span class="qicon">🛒</span>Lista de<br>Compras</button><button data-go="rel"><span class="qicon">▥</span>Relatórios</button></div>`;
document.getElementById('materiais').innerHTML=`<div class="section-title"><h2>Materiais</h2></div><div class="card"><div class="toolbar"><input id="search" class="search" placeholder="🔍 Pesquisar por nome, código ou palavra-chave..."><select id="status"><option>Todos os status</option><option>Críticos</option><option>Reposição</option><option>OK</option></select></div><div class="list" id="productList">${productList()}</div></div><div class="card" style="margin-top:12px"><div class="section-title"><h2>Áreas</h2><span class="muted">${areas.length-1} grupos</span></div><div class="area-grid">${areas.slice(0,12).map(a=>`<button class="area" data-area="${a[1]}"><span class="emoji">${a[0]}</span><span><strong>${a[1]}</strong><small>${a[2]} itens</small></span><span class="arrow">›</span></button>`).join('')}</div></div>`;
document.getElementById('contagem').innerHTML=`<div class="card"><div class="count-head"><div><h2 style="margin:0">Realizar Contagem</h2><small class="muted">Escolha uma área e confira os itens</small></div><span class="stock warn">12 de 43</span></div><div class="steps"><div class="step active"><b>1</b>Selecionar</div><div class="step"><b>2</b>Conferir</div><div class="step"><b>3</b>Finalizar</div></div><div class="toolbar"><input class="search" placeholder="🔍 Pesquisar áreas..."></div><div class="area-grid">${areas.slice(0,15).map(a=>`<button class="area" data-count="${a[1]}"><span class="emoji">${a[0]}</span><span><strong>${a[1]}</strong><small>${a[2]} itens</small></span></button>`).join('')}</div></div><div class="card" style="margin-top:12px"><div class="section-title"><h2>Contagem — Limpeza</h2><span>28%</span></div><div class="progress"><i style="width:28%"></i></div><p class="muted" style="font-size:12px">12 de 43 itens contados</p><div class="count-list list">${products.map(p=>`<div class="item"><input class="check" type="checkbox" ${p[3]>10?'checked':''}><div class="item-img">${p[5]}</div><div class="item-info"><small>${p[0]}</small><strong>${p[1]}</strong><small>Ideal: 20 | Mín.: 5</small></div><input class="qty" value="${p[3]}" inputmode="numeric"></div>`).join('')}</div></div>`;
document.getElementById('compras').innerHTML=`<div class="section-title"><h2>Lista de Compras</h2><button class="primary" onclick="toast('Lista atualizada')">Atualizar</button></div><div class="card"><div class="list">${products.filter(p=>p[4]!=='ok').map((p,i)=>`<div class="item"><div class="item-img">${p[5]}</div><div class="item-info"><small>${p[0]}</small><strong>${p[1]}</strong><small>Estoque atual: ${p[3]} · Ideal: 20</small></div><span class="stock ${p[4]}">Comprar ${Math.max(20-p[3],0)}</span><span class="arrow">›</span></div>`).join('')}</div><div class="actions" style="margin-top:14px"><button class="primary" onclick="toast('Solicitação de orçamento criada')">Gerar orçamento</button><button class="secondary">Imprimir</button></div></div>`;
document.getElementById('mais').innerHTML=`<div class="section-title"><h2>Mais opções</h2></div><div class="area-grid">${[['🚚','Fornecedores','Cadastro e fornecedores preferenciais'],['▤','Relatórios','Relatórios de contagem e movimentações'],['⚙','Configurações','Preferências do sistema'],['💾','Backup','Exportar e importar dados']].map(x=>`<button class="area"><span class="emoji">${x[0]}</span><span><strong>${x[1]}</strong><small>${x[2]}</small></span><span class="arrow">›</span></button>`).join('')}</div>`;
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));let target=document.getElementById(id);if(!target)target=document.getElementById('mais');target.classList.add('active');document.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===id));window.scrollTo(0,0)}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go)}const a=e.target.closest('[data-area]');if(a){toast('Área selecionada: '+a.dataset.area)}const c=e.target.closest('[data-count]');if(c){toast('Iniciando contagem: '+c.dataset.count)}});
document.addEventListener('input',e=>{if(e.target.id==='search')document.getElementById('productList').innerHTML=productList(e.target.value)});
render();go('inicio');
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
